<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Minimal Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #CCC7C7;
      color: #0e0e0e;
    }

    /* NAVBAR */
    .nav {
      position: fixed;
      top: 20px;
      right: 40px;
    }

    .nav a {
      margin-left: 20px;
      color: #0e0e0e;
      text-decoration: none;
      font-size: 14px;
    }

    .nav a:hover {
      color: #fff;
    }

    /* HERO */
    .hero {
      height: 60vh;
      display: flex;
      align-items: center;
      padding-left: 80px;
      font-size: 28px;
      line-height: 1.4;
      max-width: 600px;
    }

    /* GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 40px 80px;
    }

    .tile {
      background: #1a1a1a;
      padding: 40px;
      cursor: pointer;
      transition: 0.3s;
    }

    .tile:hover {
      background: #222;
      transform: translateY(-5px);
    }

    /* MODAL */
    .modal {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 80%;
      max-width: 700px;
      background: #111;
      padding: 30px;
      transform: translate(-50%, -50%) scale(0);
      transition: 0.3s;
      z-index: 10;
      border: 1px solid #333;
    }

    .modal.active {
      transform: translate(-50%, -50%) scale(1);
    }

    .overlay {
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      background: rgba(0,0,0,0.7);
      opacity: 0;
      pointer-events: none;
      transition: 0.3s;
    }

    .overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .close {
      float: right;
      cursor: pointer;
      color: #aaa;
    }

    .close:hover {
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <div class="nav">
    <a href="#">About</a>
    <a href="#">Work</a>
    <a href="#">Contact</a>
  </div>

  <!-- HERO -->
  <div class="hero">
    <div>
      Crafting simple digital experiences.<br>
      Focused on clarity, motion, and minimal design.
    </div>
  </div>

  <!-- GRID -->
  <div class="grid">
    <div class="tile" onclick="openModal('Project One')">Project One</div>
    <div class="tile" onclick="openModal('Project Two')">Project Two</div>
    <div class="tile" onclick="openModal('Project Three')">Project Three</div>
    <div class="tile" onclick="openModal('Project Four')">Project Four</div>
  </div>

  <!-- MODAL -->
  <div class="modal" id="modal">
    <span class="close" onclick="closeModal()">✕</span>
    <h2 id="modal-title"></h2>
    <p>
      This is placeholder content. You can describe your project, add links,
      images, or anything else here.
    </p>
  </div>

  <div class="overlay" id="overlay" onclick="closeModal()"></div>

  <script>
    function openModal(title) {
      document.getElementById("modal-title").innerText = title;
      document.getElementById("modal").classList.add("active");
      document.getElementById("overlay").classList.add("active");
    }

    function closeModal() {
      document.getElementById("modal").classList.remove("active");
      document.getElementById("overlay").classList.remove("active");
    }
  </script>

</body>
</html>
