<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | 4-Column Masonry</title>
    <style>
        :root {
            --bg-color: #CCC7C7;
            --text-primary: #0e0e0e;
            --text-secondary: #4a4a4a;
            --border-normal: #ffffff;
            --border-hover: #00ffff; /* Fluorescent Blue */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center; /* Centers the header and container */
        }

        /* Navigation */
        nav {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            padding: 40px 15% 0; /* Large side padding */
            box-sizing: border-box;
            gap: 30px;
        }

        nav a {
            color: var(--text-primary);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
        }

        /* Hero Header - Centered with large side margins */
        header {
            width: 70%; /* Keeps the container centered with large side margins */
            padding: 100px 0 60px; 
            margin: 0 auto; /* This centers the header container itself */
            text-align: center; /* This centers the text inside the header */
        }

        header h1 { 
            font-size: 2.8rem; 
            margin: 0 auto 20px; /* Centered margin */ 
            font-weight: 400;
            line-height: 1.2;
            max-width: 800px; /* Prevents the text from getting too wide */
        }

        header p { 
           color: var(--text-secondary); 
            font-size: 1.2rem; 
            margin: 0 auto; /* Centers the paragraph text block */
            max-width: 600px; /* Keeps the sub-text neatly tucked in the middle */
}

        /* Tiles Container - 4 Columns */
        .masonry-grid {
            width: 70%; /* Matching header width for alignment */
            column-count: 4;
            column-gap: 20px;
            padding-bottom: 100px;
        }

        /* Responsive Columns */
        @media (max-width: 1200px) { .masonry-grid { column-count: 3; width: 85%; } header { width: 85%; } }
        @media (max-width: 900px) { .masonry-grid { column-count: 2; } }
        @media (max-width: 600px) { .masonry-grid { column-count: 1; } }

        /* Tile Styling */
        .tile {
            break-inside: avoid;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.2); /* Slight glass effect */
            border: 2px solid var(--border-normal);
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            box-sizing: border-box;
        }

        .tile:hover {
            border-color: var(--border-hover);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 255, 255, 0.15);
        }

        /* Height Variations */
        .h-1 { min-height: 200px; }
        .h-2 { min-height: 300px; }
        .h-3 { min-height: 400px; }
        .h-4 { min-height: 250px; }

        .tile span { 
            font-size: 11px; 
            text-transform: uppercase; 
            letter-spacing: 1.5px; 
            color: var(--text-secondary);
        }

        .tile h3 { 
            margin: 10px 0 0; 
            font-size: 1.2rem; 
            font-weight: 500; 
        }

        /* Modal styling remains largely the same for functionality */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--bg-color);
            z-index: 1000;
        }

        .modal-content {
            margin: 10% auto;
            width: 60%;
            max-width: 800px;
        }

        .close-btn {
            position: absolute;
            top: 40px; right: 15%;
            font-size: 40px;
            cursor: pointer;
        }
        /* This makes the transition smooth */
/* 1. Style the image inside the tile */
.tile img {
    width: 100%;
    border-radius: 4px;
    margin-bottom: 15px;
    filter: grayscale(100%); /* Start Black & White */
    transition: filter 0.4s ease; /* Smooth transition */
}

/* 2. When the TILE is hovered, change the IMAGE inside it */
.tile:hover img {
    filter: grayscale(0%); /* Turn to Full Color */
}
}
    </style>
</head>
<body>

    <nav>
        <a href="#">Works</a>
        <a href="#">About</a>
    </nav>

    <header>
        <h1>A digital playground for modern aesthetics.</h1>
        <p>Exploring the intersection of code and visual balance.</p>
    </header>

    <div class="masonry-grid" id="tileContainer"></div>

    <div id="projectModal" class="modal">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <div class="modal-content">
            <h2 id="modalTitle"></h2>
            <p id="modalBody"></p>
        </div>
    </div>

    <script>
    // 1. DATA SECTION: Just add a new line here every day
    const myProjects = [
        { 
        title: "Project 01", 
        category: "Development", 
        content: "Power BI has a unique way to overlap charts one over the other by using a simple technique - hyperlink...", 
        size: "h-3",
        image: "https://wowslider.com/sliders/demo-87/data1/images/landscape404072_1280.jpg" // Add this line
    },
        { title: "Day 995: New Bees", category: "New Build", content: "This is the text that appears when the tile is clicked.", size: "h-2",
          image:"https://wowslider.com/sliders/demo-31/data1/images/bench560435.jpg" },
        { title: "Project 01", category: "Development", content: "Details for day 1...", size: "h-3" },
        { title: "Project 02", category: "Design", content: "Details for day 2...", size: "h-1" },
        { title: "Project 03", category: "Concept", content: "Details for day 3...", size: "h-4" },
        { title: "Project 04", category: "Archive", content: "Details for day 4...", size: "h-2" },
        { title: "Day 05: New Concept", category: "Daily Build", content: "This is the text that appears when the tile is clicked.", size: "h-2" },
        // To add a new one, just copy the line below and paste it:
        // { title: "New Tile", category: "Daily", content: "Fresh content here", size: "h-1" },
    ];

    // 2. LOGIC SECTION: This builds the tiles automatically
    const container = document.getElementById('tileContainer');

    function renderTiles() {
    container.innerHTML = ""; 
    myProjects.forEach((project) => {
        const tile = document.createElement('div');
        tile.className = `tile ${project.size}`;
        tile.onclick = () => openModal(project.title, project.content);
        
        // This is the updated part:
        tile.innerHTML = `
           <img src="${project.image}" alt="${project.title}">
           <span>${project.category}</span>
            <h3>${project.title}</h3>
        `;
        container.appendChild(tile);
    });
}

    // Modal Functions
    function openModal(title, text) {
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalBody').innerText = text;
        document.getElementById('projectModal').style.display = 'block';
        document.body.style.overflow = 'hidden';
    }

    function closeModal() {
        document.getElementById('projectModal').style.display = 'none';
        document.body.style.overflow = 'auto';
    }

    // Run the render on page load
    renderTiles();
</script>
</body>
</html>
