<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Minimalist</title>
    <style>
        /* Base Styling */
        :root {
            --bg-color: #0d0d0d; /* Dark background from base site */
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --accent: #333333;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        /* Navigation */
        nav {
            display: flex;
            justify-content: flex-end;
            padding: 2rem 5%;
            gap: 2rem;
        }

        nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        nav a:hover { color: var(--text-primary); }

        /* Hero Header */
        header {
            padding: 4rem 10% 2rem;
            max-width: 800px;
        }

        header h1 { font-size: 2.5rem; margin-bottom: 0.5rem; }
        header p { color: var(--text-secondary); font-size: 1.2rem; }

        /* Grid Layout */
        .container {
            padding: 2rem 10% 5rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        /* Tile Styling */
        .tile {
            background: #1a1a1a;
            border: 1px solid var(--accent);
            padding: 2rem;
            height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.3s;
        }

        .tile:hover {
            transform: translateY(-5px);
            border-color: #555;
        }

        .tile h3 { margin: 0; font-weight: 500; }
        .tile span { font-size: 0.8rem; color: var(--text-secondary); }

        /* Floating Webpage (Modal) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #1a1a1a;
            width: 90%;
            max-width: 800px;
            height: 80vh;
            padding: 3rem;
            position: relative;
            overflow-y: auto;
            border: 1px solid var(--accent);
            border-radius: 8px;
        }

        .close-btn {
            position: absolute;
            top: 20px; right: 30px;
            font-size: 2rem;
            cursor: pointer;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

    <nav>
        <a href="#">Work</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>

    <header>
        <h1>Creative Portfolio</h1>
        <p>A collection of projects focusing on design, code, and simplicity.</p>
    </header>

    <div class="container">
        <div class="tile" onclick="openModal('Project One', 'Detailed description of the first project goes here. You can add images, links, or text.')">
            <span>Category 01</span>
            <h3>Project Discovery</h3>
        </div>

        <div class="tile" onclick="openModal('Project Two', 'This is the floating content for the second project. Super clean and focused.')">
            <span>Category 02</span>
            <h3>System Architecture</h3>
        </div>

        <div class="tile" onclick="openModal('Project Three', 'Details about project three.')">
            <span>Category 03</span>
            <h3>Visual Identity</h3>
        </div>
    </div>

    <div id="projectModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle"></h2>
            <hr style="border: 0; border-top: 1px solid #333; margin: 1.5rem 0;">
            <p id="modalBody"></p>
        </div>
    </div>

    <script>
        function openModal(title, text) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalBody').innerText = text;
            document.getElementById('projectModal').style.display = 'flex';
            document.body.style.overflow = 'hidden'; // Stop scrolling background
        }

        function closeModal() {
            document.getElementById('projectModal').style.display = 'none';
            document.body.style.overflow = 'auto'; // Enable scrolling again
        }

        // Close if user clicks outside the content box
        window.onclick = function(event) {
            let modal = document.getElementById('projectModal');
            if (event.target == modal) closeModal();
        }
    </script>
</body>
</html>
